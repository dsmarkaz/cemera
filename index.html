<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>D. Vault - Login & Camera</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #0d0d0d url('1.jfif') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      position: fixed;
      inset: 0;
    }

    .card-wrapper {
      width: 90%;
      max-width: 380px;
      height: 520px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-wrapper.expanded {
      height: 620px;
    }

    .card {
      width: 100%;
      height: 100%;
      background: rgba(23, 23, 23, 0.25);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.501);
      border-radius: 25px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.301);
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Login View States */
    #loginView {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    #loginView.fade-out {
      opacity: 0;
      visibility: hidden;
      transform: scale(0.95);
      pointer-events: none;
    }

    /* Camera View States */
    #cameraView {
      opacity: 0;
      visibility: hidden;
      transform: scale(1.05);
      transition: opacity 0.5s ease 0.3s, transform 0.5s ease 0.3s;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: absolute;
      inset: 0;
    }

    #cameraView.fade-in {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 2.2em 2em 1.5em 2em;
      border-radius: 25px;
      text-align: center;
      align-items: center;
      height: 100%;
    }

    .heading-font {
      color: rgb(255, 255, 255);
      font-weight: 600;
      letter-spacing: 0.5px;
      width: 100%;
      font-size: 1.4em;
      margin-bottom: 0.5em;
      font-family:'Times New Roman', Times, serif;
    }

    .profile-upload-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin: 2px 0 8px 0;
    }

    .profile-avatar-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 2px dashed rgba(255, 255, 255, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .profile-avatar-circle:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: #fff;
    }

    .profile-avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .camera-icon-center {
      width: 34px;
      height: 34px;
      fill: rgba(255, 255, 255, 0.9);
      filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.4));
      transition: transform 0.2s ease;
    }

    .add-photo-label {
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.8em;
      font-weight: 500;
    }

    .field {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5em;
      border-radius: 25px;
      padding: 0.65em 1em;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      background-color: rgba(0, 0, 0, 0.189);
      box-shadow: inset 2px 5px 10px rgba(0, 0, 0, 0.4);
      width: 100%;
    }

    .input-icon {
      height: 1.3em;
      width: 1.3em;
      fill: rgba(255, 255, 255, 0.8);
    }

    .input-field {
      background: none;
      border: none;
      outline: none;
      width: 100%;
      color: #ffffff;
      font-size: 16px;
    }

    .input-field::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .standard-button {
      width: 100%;
      padding: 0.65em;
      border-radius: 25px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      outline: none;
      background-color: rgba(255, 255, 255, 0.429);
      color: rgba(14, 13, 13, 0.8);
      font-size: 0.95em;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .standard-button:hover {
      background-color: rgba(255, 255, 255, 0.3);
      color: white;
    }

    /* Camera UI Styles */
    .camera-header {
      padding: 10px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .back-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      padding: 5px;
      border-radius: 50%;
      transition: background 0.2s;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .back-icon {
      width: 22px;
      height: 22px;
      fill: white;
    }

    .emoji-display-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    #targetEmoji {
      width: 44px;
      height: 44px;
      object-fit: contain;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
      animation: floatEmoji 2s ease-in-out infinite;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .slide-out {
      transform: translateY(-20px) scale(0.8);
      opacity: 0;
    }

    @keyframes floatEmoji {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .emoji-instruction {
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.75em;
      font-weight: 500;
      margin-top: 2px;
      letter-spacing: 0.3px;
    }

    .progress-bar-container {
      width: 70%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      margin-top: 5px;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #22c55e;
      border-radius: 2px;
      transition: width 0.1s linear;
    }

    .camera-view-container {
      flex: 1;
      margin: 5px 15px 0 15px;
      border-radius: 18px;
      overflow: hidden;
      background: #000;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    #cameraFeed {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camera-footer {
      padding: 15px 20px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    .capture-main-btn {
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      border: 4px solid rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: transform 0.1s;
    }

    .capture-main-btn:active {
      transform: scale(0.92);
    }

    .control-icon {
      width: 22px;
      height: 22px;
      fill: white;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/human/dist/human.js"></script>
</head>
<body>

  <!-- Hidden Inputs -->
  <input type="file" id="profileImageInput" accept="image/*" style="display: none;">

  <!-- Main Card Wrapper -->
  <div class="card-wrapper" id="cardWrapper">

    <!-- FRONT CARD: LOGIN -->
    <div class="card" id="loginView">
      <form class="form" id="loginForm">
        <p class="heading-font">Welcome</p>
        
        <div class="profile-upload-container">
          <div class="profile-avatar-circle" id="avatarCircle" title="Upload Photo">
            <svg id="cameraIcon" class="camera-icon-center" viewBox="0 0 24 24">
              <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"/>
              <path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5 z"/>
            </svg>
            <img id="userUploadedImage" alt="Profile Picture">
          </div>
          <span class="add-photo-label" id="photoLabelText">Add your profile picture</span>
        </div>

        <div class="field">
          <svg viewBox="0 0 24 24" fill="currentColor" class="input-icon">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"></path>
          </svg>
          <input type="text" class="input-field" placeholder="Enter your name" id="userName" autocomplete="off" required />
        </div>

        <div class="field">
          <svg viewBox="0 0 16 16" fill="currentColor" class="input-icon">
            <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0 -2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0 -2-2z"></path>
          </svg>
          <input type="password" class="input-field" placeholder="Password" id="passwordInput" required />
        </div>

        <div style="width: 100%; margin-top: 5px;">
          <button type="submit" class="standard-button">Access Camera</button>
        </div>
      </form>
    </div>

    <!-- CAMERA VIEW (Initially Hidden inside the card structure) -->
    <div class="card" id="cameraView">
      <div class="camera-header">
        <button class="back-btn" id="backBtn" title="Back">
          <svg class="back-icon" viewBox="0 0 24 24">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
          </svg>
        </button>

        <div class="emoji-display-box">
          <img id="targetEmoji" src="1.png" alt="Emoji Challenge">
          <span class="emoji-instruction" id="instructionText">Match this expression (1/5)</span>
          <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progressBarFill"></div>
          </div>
        </div>

        <div style="width: 32px;"></div>
      </div>

      <div class="camera-view-container">
        <video id="cameraFeed" autoplay playsinline muted></video>
      </div>

      <div class="camera-footer">
        <button class="control-btn" id="flipBtn" title="Flip Camera">
          <svg class="control-icon" viewBox="0 0 24 24">
            <path d="M20 4h-3.17L15 2H9L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-5 11.5V13H9v2.5L5.5 12 9 8.5V11h6V8.5l3.5 3.5-3.5 3.5z"/>
          </svg>
        </button>

        <button class="capture-main-btn" id="captureBtn" title="Capture Photo"></button>

        <div style="width: 45px;"></div>
      </div>
    </div>

  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const loginView = document.getElementById('loginView');
    const cameraView = document.getElementById('cameraView');
    const cardWrapper = document.getElementById('cardWrapper');
    const avatarCircle = document.getElementById('avatarCircle');
    const profileImageInput = document.getElementById('profileImageInput');
    const userUploadedImage = document.getElementById('userUploadedImage');
    const cameraIcon = document.getElementById('cameraIcon');
    const userNameInput = document.getElementById('userName');
    const passwordInput = document.getElementById('passwordInput');
    const photoLabelText = document.getElementById('photoLabelText');
    const backBtn = document.getElementById('backBtn');

    let isImageUploaded = false;
    let currentProfileImageSrc = "";

    const videoElement = document.getElementById('cameraFeed');
    const flipBtn = document.getElementById('flipBtn');
    const captureBtn = document.getElementById('captureBtn');
    const targetEmoji = document.getElementById('targetEmoji');
    const instructionText = document.getElementById('instructionText');
    const progressBarFill = document.getElementById('progressBarFill');

    let currentFacingMode = 'user';
    let currentStream = null;

    const emojis = ['1.png', '2.png', '3.png', '4.png', '5.png'];
    let currentIndex = 0;
    let progress = 0;
    let aiReady = false;
    let detecting = false;
    let transitionLocked = false;
    let lastDetectionTime = 0;

    const MATCH_TIME = 1200;
    const TONGUE_MATCH_TIME = 700;
    const DETECTION_INTERVAL = 100;

    const humanConfig = {
      backend: 'webgl',
      modelBasePath: 'https://cdn.jsdelivr.net/npm/@vladmandic/human/models/',
      cacheModels: true,
      async: true,
      filter: { enabled: false },

      face: {
        enabled: true,
        detector: { enabled: true, maxDetected: 1, minConfidence: 0.35, rotation: true },
        mesh: { enabled: true },
        iris: { enabled: true },
        emotion: { enabled: true, minConfidence: 0.15 },
        description: { enabled: false },
        antispoof: { enabled: false },
        liveness: { enabled: false }
      },

      gesture: { enabled: true },
      body: { enabled: false },
      hand: { enabled: false },
      object: { enabled: false },
      segmentation: { enabled: false }
    };

    let human = null;

    async function initFaceAI() {
      try {
        if (!window.Human) throw new Error('Human AI library did not load.');
        human = new Human.Human(humanConfig);
        await human.load();
        aiReady = true;
        instructionText.textContent = 'Match this expression (1/5)';
        startFaceMatching();
      } catch (error) {
        console.error('Face AI loading error:', error);
        instructionText.textContent = 'Face AI loading...';
        setTimeout(initFaceAI, 2500);
      }
    }

    async function startCamera(facing) {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      try {
        const constraints = {
          video: { facingMode: facing, width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        };

        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        videoElement.srcObject = currentStream;
        await videoElement.play();

        progress = 0;
        progressBarFill.style.width = '0%';
      } catch (error) {
        console.error('Camera access error:', error);
        instructionText.textContent = 'Camera access denied';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedName = localStorage.getItem('d_vault_username');
      const savedProfile = localStorage.getItem('d_vault_profile');

      if (savedName) userNameInput.value = savedName;

      if (savedProfile) {
        currentProfileImageSrc = savedProfile;
        userUploadedImage.src = currentProfileImageSrc;
        userUploadedImage.style.display = 'block';
        cameraIcon.style.display = 'none';
        avatarCircle.style.borderStyle = 'solid';
        isImageUploaded = true;
        photoLabelText.textContent = "Profile picture loaded";
      }
    });

    avatarCircle.addEventListener('click', () => profileImageInput.click());

    profileImageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          currentProfileImageSrc = evt.target.result;
          userUploadedImage.src = currentProfileImageSrc;
          userUploadedImage.style.display = 'block';
          cameraIcon.style.display = 'none';
          avatarCircle.style.borderStyle = 'solid';
          isImageUploaded = true;
          localStorage.setItem('d_vault_profile', currentProfileImageSrc);
        };
        reader.readAsDataURL(file);
      }
    });

    // Login Form Submission with Smooth Transition
    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      if (!isImageUploaded) {
        alert("Please upload a profile picture first!");
        return;
      }

      const userName = userNameInput.value.trim();
      localStorage.setItem('d_vault_username', userName);

      // Trigger transition to camera view
      cardWrapper.classList.add('expanded');
      loginView.classList.add('fade-out');
      cameraView.classList.add('fade-in');

      await startCamera(currentFacingMode);
      if (!aiReady) {
        initFaceAI();
      }
    });

    flipBtn.addEventListener('click', async (event) => {
      event.preventDefault();
      currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
      await startCamera(currentFacingMode);
    });

    function getEmotion(face) {
      if (!face || !face.emotion) return { emotion: '', score: 0 };
      if (Array.isArray(face.emotion)) {
        return face.emotion.reduce(
          (best, item) => item.score > best.score ? { emotion: item.emotion, score: item.score } : best,
          { emotion: '', score: 0 }
        );
      }
      return { emotion: face.emotion.emotion || '', score: face.emotion.score || 0 };
    }

    function getFaceGestures(result) {
      if (!Array.isArray(result.gesture)) return [];
      return result.gesture
        .filter(item => item.face === '0' || item.face === 0)
        .map(item => String(item.gesture).toLowerCase());
    }

    function getMouthOpenPercent(gestures) {
      for (const g of gestures) {
        const match = g.match(/mouth\s+(\d+)%\s+open/i);
        if (match) return Number(match[1]);
      }
      return 0;
    }

    function hasWink(gestures) {
      return gestures.some(g => g.includes('blink left eye') || g.includes('blink right eye'));
    }

    function isCurrentExpressionMatched(result) {
      const face = result.face && result.face[0];
      if (!face) return false;

      const emotion = getEmotion(face);
      const gestures = getFaceGestures(result);
      const mouthOpen = getMouthOpenPercent(gestures);

      if (currentIndex === 0) {
        return hasWink(gestures) && (emotion.emotion === 'happy' || emotion.score >= 0.20);
      }
      if (currentIndex === 1) {
        return (emotion.emotion === 'surprised' && emotion.score >= 0.35) || mouthOpen >= 55;
      }
      if (currentIndex === 2) {
        return emotion.emotion === 'happy' && emotion.score >= 0.55 && mouthOpen < 72;
      }
      if (currentIndex === 3) {
        return emotion.emotion === 'sad' && emotion.score >= 0.25;
      }
      if (currentIndex === 4) {
        const tongueGesture = gestures.some(g => g.includes('tongue') || g.includes('tongue out'));
        return tongueGesture || (emotion.emotion === 'happy' && emotion.score >= 0.25 && mouthOpen >= 55);
      }

      return false;
    }

    function updateMatchProgress(matched, elapsed) {
      const activeMatchTime = currentIndex === 4 ? TONGUE_MATCH_TIME : MATCH_TIME;

      if (matched) {
        progress += (elapsed / activeMatchTime) * 100;
      } else {
        progress -= 2.0;
      }

      progress = Math.max(0, Math.min(100, progress));
      progressBarFill.style.width = progress + '%';

      if (progress >= 100 && !transitionLocked) {
        transitionLocked = true;
        handleEmojiMatch();
      }
    }

    async function runFaceDetection(now) {
      if (!aiReady || detecting || !videoElement.videoWidth || cameraView.style.opacity === '0') return;
      if (now - lastDetectionTime < DETECTION_INTERVAL) return;

      detecting = true;
      lastDetectionTime = now;

      try {
        const result = await human.detect(videoElement);
        const matched = isCurrentExpressionMatched(result);
        updateMatchProgress(matched, DETECTION_INTERVAL);
      } catch (error) {
        console.error('Face detection error:', error);
      } finally {
        detecting = false;
      }
    }

    function startFaceMatching() {
      function loop(now) {
        runFaceDetection(now);
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    }

    function handleEmojiMatch() {
      targetEmoji.classList.add('slide-out');

      setTimeout(() => {
        currentIndex++;

        if (currentIndex < emojis.length) {
          targetEmoji.src = emojis[currentIndex];
          instructionText.textContent = `Match this expression (${currentIndex + 1}/5)`;
          progress = 0;
          progressBarFill.style.width = '0%';
          targetEmoji.classList.remove('slide-out');
          transitionLocked = false;
        } else {
          takeSnapshotAndSave();
          currentIndex = 0;
          targetEmoji.src = emojis[currentIndex];
          instructionText.textContent = 'Match this expression (1/5)';
          progress = 0;
          progressBarFill.style.width = '0%';
          targetEmoji.classList.remove('slide-out');
          transitionLocked = false;
        }
      }, 350);
    }

    captureBtn.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopPropagation();
      takeSnapshotAndSave();
    });

    function takeSnapshotAndSave() {
      if (!videoElement.videoWidth || !videoElement.videoHeight) return;

      const canvas = document.createElement('canvas');
      canvas.width = videoElement.videoWidth;
      canvas.height = videoElement.videoHeight;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

      canvas.toBlob((blob) => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `DVault_Capture_${Date.now()}.png`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      }, 'image/png');
    }

    // Back button to return to login view smoothly
    backBtn.addEventListener('click', () => {
      currentIndex = 0;
      progress = 0;
      transitionLocked = false;
      targetEmoji.src = emojis[0];
      instructionText.textContent = 'Match this expression (1/5)';
      progressBarFill.style.width = '0%';
      targetEmoji.classList.remove('slide-out');

      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      cameraView.classList.remove('fade-in');
      loginView.classList.remove('fade-out');
      cardWrapper.classList.remove('expanded');
    });
  </script>
</body>
</html>
